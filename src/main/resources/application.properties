# Server Configuration
server.port=8080
spring.application.name=Codebase Lineage

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/lineage
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging Configuration
logging.level.root=INFO
logging.level.com.lineage=DEBUG
logging.level.org.eclipse.jgit=WARN

# Application Security
app.security.username=admin
app.security.password=lineage123

# Analysis Configuration
app.analysis.max-commits=10000
app.analysis.cochange-limit=50
app.analysis.min-cochange-frequency=2
